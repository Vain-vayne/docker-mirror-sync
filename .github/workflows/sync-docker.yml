# 同步 Docker Hub 镜像到 Aliyun ACR
name: Sync Docker Hub images to Aliyun ACR
# 触发条件
on:
  # 手动触发
  workflow_dispatch:
    # 输入参数
    inputs:
      # 输入参数：镜像列表
      images:
        description: 'Docker Hub 镜像列表（多个镜像用空格/换行分隔，如：nginx:latest docker.io/redis:6.2 quay.io/calico/apiserver:v3.31.4）'
        required: true
      # 输入参数：目标平台架构
      platforms:
        description: '目标平台架构（多个平台用逗号分隔，如：linux/amd64,linux/arm64,linux/arm/v7）'
        required: false
        default: 'linux/amd64,linux/arm64'

jobs:
  # 同步多个镜像
  sync-multiple-images:
    # 运行环境
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      # 登录 Aliyun ACR
      - name: Login to Aliyun ACR
        run: |
          docker login -u "${{ secrets.ACR_USERNAME }}" -p "${{ secrets.ACR_PASSWORD }}" ${{ secrets.ACR_REGISTRY }}
      # 同步多个镜像
      - name: Sync multiple images to Aliyun ACR
        run: |
          # 分割镜像列表并遍历
          IFS=$' \n' read -r -a IMAGES <<< "${{ github.event.inputs.images }}"

          # 分割平台列表
          IFS=',' read -r -a PLATFORMS <<< "${{ github.event.inputs.platforms }}"

          # 遍历每个镜像进行同步
          for IMAGE in "${IMAGES[@]}"; do
              # 多架构清单列表
              MANIFEST_TAGS=()

              # 跳过空值（避免分隔符导致的空元素）
              [ -z "$IMAGE" ] && continue

              echo "====================================="
              echo "开始处理镜像：$IMAGE"
              echo "目标平台：${{ github.event.inputs.platforms }}"
              echo "====================================="

              # 补全 docker.io 前缀（仅无域名时）
              IMAGE_FULL="$IMAGE"
              # 如果是简单名称，如 "nginx" 或 "nginx:latest"
              if [[ "$IMAGE_FULL" != *.*/* ]]; then
                  if [[ "$IMAGE_FULL" == */* ]]; then
                      # 如果包含斜杠（如 library/nginx），直接加前缀
                      IMAGE_FULL="docker.io/$IMAGE_FULL"
                  else
                      # 如果不包含斜杠（如 nginx），是否需要补全为 docker.io/library/xxx --- 待定
                      IMAGE_FULL="docker.io/$IMAGE_FULL"
                  fi
              fi

              # 判断镜像名是否包含 ":"
              if [[ "$IMAGE_FULL" == *:* ]]; then
                  # 有冒号：正常提取 TAG
                  TAG=$(echo "$IMAGE_FULL" | awk -F ':' '{print $NF}')
              else
                  # 无冒号：设为 latest，并修正 IMAGE_FULL
                  TAG="latest"
                  IMAGE_FULL="${IMAGE_FULL}:latest"
              fi

              # 构建基础镜像名（不包含平台）
              ACR_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/$(echo "$IMAGE_FULL" | tr '/' '_')"

              # 遍历每个平台进行同步
              for PLATFORM in "${PLATFORMS[@]}"; do

                  # 构建特定平台的目标镜像名 (通常包含平台信息)
                  PLATFORM_ACR_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/$(echo "$IMAGE_FULL-$PLATFORM" | tr '/' '_')"

                  # 核心逻辑：非 latest 标签时检查ACR是否已存在该镜像
                  if [ "$TAG" != "latest" ]; then
                      echo "检查阿里云ACR中是否存在镜像：$PLATFORM_ACR_IMAGE"
                      # 用 docker manifest inspect 检查镜像是否存在（无输出则不存在）
                      if docker manifest inspect "$PLATFORM_ACR_IMAGE" > /dev/null 2>&1; then
                          MANIFEST_TAGS+=("${PLATFORM_ACR_IMAGE}")
                          echo "✅ 镜像 $PLATFORM_ACR_IMAGE 已存在，跳过同步"
                          echo ""
                          continue
                      else
                          echo "🔍 镜像 $PLATFORM_ACR_IMAGE 不存在，开始同步"
                      fi
                  else
                      echo "📌 镜像标签为 latest，直接同步（不检查是否存在）"
                  fi

                  # 拉取镜像（指定平台）
                  echo "拉取镜像：$IMAGE_FULL(平台: $PLATFORM)"
                  if ! docker pull --platform "${PLATFORM}" "$IMAGE_FULL"; then
                      echo "❌ 拉取失败，跳过该镜像"
                      echo ""
                      continue
                  fi

                  # 打标签并推送
                  echo "打标签：$IMAGE_FULL → $PLATFORM_ACR_IMAGE"
                  docker tag "$IMAGE_FULL" "$PLATFORM_ACR_IMAGE"

                  echo "推送镜像到阿里云 ACR：$PLATFORM_ACR_IMAGE"
                  if docker push "$PLATFORM_ACR_IMAGE"; then
                      MANIFEST_TAGS+=("${PLATFORM_ACR_IMAGE}")
                      echo "✅ 镜像 $IMAGE 同步完成！国内地址：$PLATFORM_ACR_IMAGE"
                  else
                      echo "❌ 推送镜像 $PLATFORM_ACR_IMAGE 失败"
                  fi
              done

              if [ -z "${MANIFEST_TAGS[*]}" ]; then
                  echo "❌ 架构清单列表为空！"
                  exit 1
              fi

              echo "多架构清单列表：${MANIFEST_TAGS[*]}"

              # 使用 docker manifest create 命令创建清单列表
              if docker manifest create "$ACR_IMAGE" "${MANIFEST_TAGS[@]}"; then
                  echo "✅ 多架构清单列表创建成功"
              else
                  echo "❌ 多架构清单列表创建失败！"
                  exit 1
              fi

              # 使用 docker manifest push 命令将清单列表推送到仓库
              if docker manifest push "$ACR_IMAGE"; then
                  echo "✅ 多架构清单列表 $ACR_IMAGE 推送成功！国内地址：$ACR_IMAGE"
                  echo "现在可以使用 'docker pull $ACR_IMAGE' 拉取适合当前架构的镜像了。"
              else
                  echo "❌ 多架构清单列表 $ACR_IMAGE 推送失败！"
                  exit 1
              fi

              echo "====================================="
              echo "🎉 镜像 $IMAGE 同步完成！国内地址：$ACR_IMAGE"
              echo "====================================="

              echo ""
          done

          echo "====================================="
          echo "🎉 所有镜像同步流程执行完毕！"
          echo "====================================="
      # 登出 Aliyun ACR
      - name: Logout from Aliyun ACR
        if: always()  # 无论前面步骤是否成功，都执行登出
        run: |
          docker logout ${{ secrets.ACR_REGISTRY }}
